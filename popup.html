<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Annotator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      Page Annotator
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="toggleTheme" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="tools">Tools</button>
    <button class="tab" data-tab="annotations">Annotations</button>
    <button class="tab" data-tab="stats">Stats</button>
  </div>

  <!-- Tools Tab -->
  <div class="tab-content active" id="tab-tools">
    <!-- Annotation Mode Toggle -->
    <div class="toolbar-section">
      <div class="toggle-row">
        <span class="toggle-label">Annotation Mode</span>
        <div class="toggle-switch" id="annotationModeToggle"></div>
      </div>
    </div>

    <!-- Tools -->
    <div class="toolbar-section">
      <div class="section-title">Tools</div>
      <div class="tools-grid">
        <button class="tool-btn active" data-tool="highlight">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          Highlight
        </button>
        <button class="tool-btn" data-tool="underline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 3v7a6 6 0 006 6 6 6 0 006-6V3"/>
            <line x1="4" y1="21" x2="20" y2="21"/>
          </svg>
          Underline
        </button>
        <button class="tool-btn" data-tool="strikethrough">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 4H9a3 3 0 00-3 3v0a3 3 0 003 3h6a3 3 0 013 3v0a3 3 0 01-3 3H7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
          </svg>
          Strike
        </button>
        <button class="tool-btn" data-tool="note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Note
        </button>
        <button class="tool-btn" data-tool="draw">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            <path d="M2 2l7.586 7.586"/>
            <circle cx="11" cy="11" r="2"/>
          </svg>
          Draw
        </button>
      </div>

      <!-- Color Palette -->
      <div class="color-palette" id="colorPalette">
        <div class="color-swatch active" data-color="#ffeb3b" style="background:#ffeb3b" title="Yellow"></div>
        <div class="color-swatch" data-color="#4caf50" style="background:#4caf50" title="Green"></div>
        <div class="color-swatch" data-color="#2196f3" style="background:#2196f3" title="Blue"></div>
        <div class="color-swatch" data-color="#e91e63" style="background:#e91e63" title="Pink"></div>
        <div class="color-swatch" data-color="#ff9800" style="background:#ff9800" title="Orange"></div>
      </div>

      <!-- Draw Options -->
      <div class="draw-options" id="drawOptions" style="display:none">
        <div class="draw-size">
          <label>Size:</label>
          <input type="range" id="drawSize" min="1" max="20" value="3">
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="toolbar-section">
      <div class="section-title">Quick Actions</div>
      <div class="tools-grid">
        <button class="tool-btn" id="prevAnnotation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
          Prev
        </button>
        <button class="tool-btn" id="nextAnnotation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9,6 15,12 9,18"/>
          </svg>
          Next
        </button>
        <button class="tool-btn" id="clearPageAnnotations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3,6 5,6 21,6"/>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
          Clear Page
        </button>
      </div>
    </div>
  </div>

  <!-- Annotations Tab -->
  <div class="tab-content" id="tab-annotations">
    <div class="toolbar-section">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search annotations...">
      </div>
    </div>

    <div class="annotation-list" id="annotationList">
      <!-- Annotations populated by JS -->
    </div>
  </div>

  <!-- Stats Tab -->
  <div class="tab-content" id="tab-stats">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalAnnotations">0</div>
        <div class="stat-label">Total Annotations</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="pagesAnnotated">0</div>
        <div class="stat-label">Pages Annotated</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="pageAnnotationCount">0</div>
        <div class="stat-label">This Page</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="highlightsCount">0</div>
        <div class="stat-label">Highlights</div>
      </div>
    </div>

    <!-- Export/Import Section -->
    <div class="actions-section" style="position:relative">
      <button class="btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7,10 12,15 17,10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export Annotations
      </button>
      <div class="export-menu" id="exportMenu">
        <button class="export-option" data-format="json">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
          Export as JSON
        </button>
        <button class="export-option" data-format="markdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
          Export as Markdown
        </button>
        <button class="export-option" data-format="html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <polyline points="16,18 22,12 16,6"/>
            <polyline points="8,6 2,12 8,18"/>
          </svg>
          Export as HTML
        </button>
        <button class="export-option" data-format="page-json">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
          Export This Page (JSON)
        </button>
      </div>

      <button class="btn" id="importBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17,8 12,3 7,8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Import Annotations
      </button>
      <input type="file" id="importFile" class="file-input" accept=".json">

      <button class="btn danger" id="clearAllBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3,6 5,6 21,6"/>
          <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/>
          <line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
        Clear All Annotations
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="pageUrl" title="">No page loaded</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
